<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

    <title>StudyQuest</title>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            height: 70px;
            background: #111827;
            display: flex;
            align-items: center;
        }

        .nav-container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        .brand span {
            margin-right: 8px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: white;
        }

        .page-container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .page-container h1 {
            margin-bottom: 25px;
        }

    </style>

</head>


<body th:fragment="body">

    <nav class="navbar">

        <div class="nav-container">

            <a
                href="/"
                class="brand">

                <span>🎓</span>
                StudyQuest

            </a>


            <div class="nav-links">

                <a href="/">
                    Dashboard
                </a>

                <a href="#tasks">
                    Tasks
                </a>

                <a href="#progress">
                    Progress
                </a>

            </div>

        </div>

    </nav>


    <main class="page-container">

        <!-- Dashboard content is rendered by index.html -->

    </main>

</body>

</html>
